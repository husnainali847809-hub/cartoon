name: Automated Cartoon Shorts Bot

on:
  schedule:
    - cron: '0 2 * * *'  # 07:00 AM Pakistan time: prepare and queue all 5 parts

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-run:
    # Skip only the scheduled run on 10 November 2026 (content is already queued).
    # Manual workflow_dispatch runs remain available.
    if: ${{ github.event_name != 'schedule' || github.run_started_at < '2026-11-10T00:00:00Z' || github.run_started_at >= '2026-11-11T00:00:00Z' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Run script and queue short in Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: |
          python -m py_compile main.py
          python main.py

      - name: Save processed cartoon history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processed_cartoon_sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Save processed cartoon history"
            git push
          fi
