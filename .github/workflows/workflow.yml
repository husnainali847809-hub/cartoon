name: Automated Cartoon Shorts Bot

on:
  schedule:
    - cron: '5 2 * * *'  # 07:05 AM Pakistan time

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Run script and queue short in Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: |
          python -m py_compile main.py
          python main.py

      - name: Save processed cartoon history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processed_cartoon_sources.json cartoon_queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Save processed cartoon history"
            git push
          fi
