name: Automated Cartoon Shorts Bot

on:
  # One daily source scan and Buffer batch run; the script schedules four daily posts.
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Download original creator videos and schedule four Buffer posts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: |
          python -m py_compile main.py
          python main.py

      - name: Save processed cartoon history and remaining queue
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processed_cartoon_sources.json cartoon_queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Save cartoon posting history and queue"
            git pull --rebase origin main
            git push origin main
          fi
