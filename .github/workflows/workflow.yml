name: Automated Cartoon Shorts Bot

on:
  schedule:
    - cron: '0 4 * * *'  # 09:00 AM Pakistan time
    - cron: '0 7 * * *'  # 12:00 PM Pakistan time
    - cron: '0 10 * * *' # 03:00 PM Pakistan time
    - cron: '0 13 * * *' # 06:00 PM Pakistan time
    - cron: '0 16 * * *' # 09:00 PM Pakistan time

  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Run script and queue short in Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python main.py
