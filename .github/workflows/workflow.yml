name: Automated Cartoon Shorts Bot

on:
  schedule:
    - cron: '0 4 * * *'  # 1. Subah 09:00 AM PKT
    - cron: '0 7 * * *'  # 2. Dopehar 12:00 PM PKT
    - cron: '0 10 * * *' # 3. Sehpar 03:00 PM PKT
    - cron: '0 13 * * *' # 4. Shaam 06:00 PM PKT
    - cron: '0 16 * * *' # 5. Raat 09:00 PM PKT
  
  workflow_dispatch: # Manual button ke liye

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Node.js JavaScript runtime
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Libraries
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade -r requirements.txt
        python -m pip install --upgrade "yt-dlp[default]"
        node --version
        yt-dlp --version

    - name: Run Script to Generate and Send Short to Buffer
      env:
        BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        BUFFER_PROFILE_ID: ${{ secrets.BUFFER_PROFILE_ID }}
        YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      run: python main.py
