name: Automated Cartoon Shorts Bot

on:
  # Testing is manual-only. Re-enable schedule after review approval.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Render cartoon parts for manual review
        run: |
          python -m py_compile main.py
          python main.py


      - name: Upload review videos for download
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-review-videos
          path: review_output/*.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Save processed cartoon history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processed_cartoon_sources.json cartoon_queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Save processed cartoon history"
            git pull --rebase origin main
            git push origin main
          fi
