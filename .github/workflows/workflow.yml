name: Automated Cartoon Shorts Bot

on:
  schedule:
    # Yeh cron jobs har roz din mein 5 dafa chalengi (Pakistan Time ke mutabiq set hain)
    - cron: '0 4 * * *'  # 1. Subah 09:00 AM PKT (04:00 UTC)
    - cron: '0 7 * * *'  # 2. Dopehar 12:00 PM PKT (07:00 UTC)
    - cron: '0 10 * * *' # 3. Sehpar 03:00 PM PKT (10:00 UTC)
    - cron: '0 13 * * *' # 4. Shaam 06:00 PM PKT (13:00 UTC)
    - cron: '0 16 * * *' # 5. Raat 09:00 PM PKT (16:00 UTC)
  
  workflow_dispatch: # Isse aap jab chahein manual button daba kar bhi chala sakte hain

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies for Video Editing
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Libraries
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Script to Generate and Send Short to Buffer
      env:
        BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        BUFFER_PROFILE_ID: ${{ secrets.BUFFER_PROFILE_ID }}
      run: python main.py
